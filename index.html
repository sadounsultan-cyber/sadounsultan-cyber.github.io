const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
let lang = st.get('biz-lang') === 'ar' ? 'ar' : 'en';
function render() {
  const t = T[lang], R = document.documentElement;
  R.lang = lang; R.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t[e.dataset.t]);
  $('#lang').textContent = t.lang; $('#wa').textContent = t.wa;
  document.title = lang === 'ar' ? 'د. سعدون مشرف السيد سلطان | أخصائي الدعم الفني والمبيعات لبذور الخضر' : 'Dr. Sadoun M. E. Sultan | Vegetable Seeds Technical Support & Sales Specialist';
  $('#svc').innerHTML = D.svc.map(x => `<div class="card"><div class="ico">${x.i}</div><h3>${esc(x[lang][0])}</h3><p>${esc(x[lang][1])}</p></div>`).join('');
  $('#exp').innerHTML = D.exp.map(x => `<div class="card"><div class="per">${x.from} – ${x.to || t.present}</div><div class="org">${esc(x.org)}</div><p>${esc(x[lang])}</p></div>`).join('');
  $('#sk').innerHTML = D.sk.map(g => `<div class="card"><h3>${esc(g[lang][0])}</h3><div class="chips">${g[lang][1].map(i => `<span>${esc(i)}</span>`).join('')}</div></div>`).join('');
  $('#edu').innerHTML = D.edu.map(x => `<div class="card"><div class="per">${x.y}</div><h3 style="margin-top:4px">${esc(x[lang][0])}</h3><p>${esc(x[lang][1])}</p></div>`).join('');
  $('#langs').innerHTML = D.langs[lang].map(l => `<span>${esc(l)}</span>`).join('');
}
$('#mail').href = `mailto:${C.email}`; $('#mail').textContent = C.email;
$('#call').href = `tel:${C.phone}`; $('#call').textContent = C.phone; $('#call').style.direction = 'ltr';
$('#li').href = C.linkedin; $('#acad').href = C.academic; $('#wa').href = `https://wa.me/${C.wa}`;
$('#copy').textContent = `© ${new Date().getFullYear()} Dr. Sadoun M. E. Sultan`;
const root = document.documentElement;
root.dataset.theme = st.get('biz-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; st.set('biz-theme', root.dataset.theme); };
$('#lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; st.set('biz-lang', lang); render(); };
$('#menu').onclick = () => { const o = $('#nav').classList.toggle('open'); $('#menu').setAttribute('aria-expanded', o); };
$('#nav').addEventListener('click', e => { if (e.target.tagName === 'A') $('#nav').classList.remove('open'); });
render();
</script>
</body>
</html>
