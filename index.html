const I18N = {

    eyebrow:'هوية أكاديمية وبحثية شخصية',title:'الدكتور سعدون مشرف السيد سلطان الهمامي',role_sub:'علوم الخضر والبحث العلمي الزراعي',tagline:'معرفة علمية، وبحث تطبيقي، وابتكار زراعي',

    h_cv:'السيرة الذاتية',h_skills:'المهارات والتدريب',h_conf:'المؤتمرات والندوات العلمية',h_exp:'الخبرات',h_edu:'المؤهلات العلمية',print:'طباعة / حفظ PDF',
    h_contact:'لنبدأ حواراً علمياً.',p_contact:'للتعاون البحثي أو الاستفسارات الأكاديمية، يمكن التواصل عبر البريد الإلكتروني.',
    f_name:'الاسم',f_email:'البريد الإلكتروني',f_msg:'رسالتك',f_send:'إرسال',f_ok:'تم الإرسال، شكراً لك.',f_err:'تعذّر الإرسال، حاول لاحقاً أو راسلني مباشرة.',

    eyebrow:'PERSONAL ACADEMIC & RESEARCH IDENTITY',title:'Dr. Sadoun.M.E. Sultan',role_sub:'Vegetable Science & Agricultural Research',tagline:'Scientific knowledge, applied research, and agricultural innovation',
    intro:'Lecturer, Department of Horticulture – Vegetable Science\nFaculty of Agriculture, Al-Azhar University – Assiut Branch',
    cta_research:'Explore research',cta_mail:'Collaborate',cv_pdf:'Download CV (PDF)',
    stat_works:'Publications synced live from ORCID',stat_title:'Lecturer',stat_title_l:'Academic rank',stat_phd:'Highest degree',
    h_research:'Publications',p_research:'This list updates automatically from your ORCID record whenever a new work is added.',
    h_interests:'Research Interests',h_teaching:'Teaching & Courses',
    h_cv:'Curriculum Vitae',h_skills:'Skills & Training',h_conf:'Conferences & Seminars',h_exp:'Experience',h_edu:'Education',print:'Print / Save as PDF',
    h_contact:"Let's start a scholarly conversation.",p_contact:'For research collaboration or academic enquiries, reach out by email.',
    f_name:'Name',f_email:'Email',f_msg:'Your message',f_send:'Send',f_ok:'Sent. Thank you.',f_err:'Could not send. Please try later or email directly.',
    loading:'Loading…',empty:'No public records on ORCID yet.',error:'Could not load ORCID data right now. Please try later.',
    present:'Present',doi:'DOI link',lang:'ع',wa:'WhatsApp'
  }
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
const get = (o, p) => p.split('.').reduce((x, k) => x?.[k], o);
const safeUrl = u => /^https:\/\//i.test(u) ? u : '';

let lang = store.get('lang') || 'ar';
let data = { works: null, jobs: null, edus: null, error: false };

/* ---------- ORCID ---------- */
const validOrcid = /^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/.test(CONFIG.orcid);

async function orcid(endpoint) {
  const key = `orcid:${CONFIG.orcid}:${endpoint}`;
  let cached = null; try { cached = JSON.parse(store.get(key) || 'null'); } catch {}
  if (cached && Date.now() - cached.t < CONFIG.cacheHours * 36e5) return cached.d;
  try {
    const r = await fetch(`https://pub.orcid.org/v3.0/${CONFIG.orcid}/${endpoint}`, { headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    store.set(key, JSON.stringify({ t: Date.now(), d }));
    return d;
  } catch (e) { if (cached) return cached.d; throw e; }
}

const normWorks = j => (j.group || []).map(g => {
  const w = g['work-summary'][0], ids = w['external-ids']?.['external-id'] || [];
  const doi = ids.find(i => i['external-id-type'] === 'doi')?.['external-id-value'];
  return { title: get(w, 'title.title.value'), journal: get(w, 'journal-title.value'),
           year: get(w, 'publication-date.year.value') || '', type: (w.type || '').replace(/_/g, ' ').toLowerCase(), doi };
}).sort((a, b) => b.year - a.year);

const normAff = (j, key) => (j['affiliation-group'] || []).flatMap(g => g.summaries || []).map(s => {
  const a = s[key];
  return { role: a['role-title'], dept: a['department-name'], org: get(a, 'organization.name'),
           from: get(a, 'start-date.year.value'), to: get(a, 'end-date.year.value') };
}).sort((a, b) => (b.from || 0) - (a.from || 0));

const FB = CONFIG.fallback;
const tkey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 45);
const byYear = (a, b) => b.year - a.year;
const mergeWorks = o => { const seen = new Set(o.map(x => tkey(x.title))); return o.concat(FB.works.filter(x => !seen.has(tkey(x.title)))).sort(byYear); };

async function load() {
  const useFallback = () => { data = { works: FB.works.slice().sort(byYear), jobs: FB.jobs, edus: FB.edus, error: false }; render(); };
  if (!validOrcid) return useFallback();
  try {
    const [w, e, d] = await Promise.all([orcid('works'), orcid('employments'), orcid('educations')]);
    const jobs = normAff(e, 'employment-summary'), edus = normAff(d, 'education-summary');
    data = { works: mergeWorks(normWorks(w)), jobs: jobs.length ? jobs : FB.jobs, edus: edus.length ? edus : FB.edus, error: false };
  } catch { return useFallback(); }
  render();
}

/* ---------- Render ---------- */
function list(items, t, row) {
  if (data.error && !items) return `<div class="status">${t.error}</div>`;
  if (!items) return `<div class="status">${t.loading}</div>`;
  return items.length ? items.map(row).join('') : `<div class="status">${t.empty}</div>`;
}
const fill = (id, arr) => { $('#' + id).innerHTML = (arr || []).map(x => `<span>${esc(x)}</span>`).join(''); };

function render() {
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'سعدون مشرف السيد سلطان الهمامي | Sadoun.M.E. Sultan' : 'Sadoun.M.E. Sultan | Lecturer of Vegetable Science';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t[el.dataset.ph]);
  $('#lang').textContent = t.lang; $('#wa').textContent = t.wa;

  $('#works').className = '';
  $('#works').innerHTML = list(data.works, t, w => `
    <article class="item"><div class="year">${esc(w.year)}</div><div>
      ${w.type ? `<span class="tag">${esc(w.type)}</span>` : ''}
      <h3>${esc(w.title)}</h3>
      <div class="sub">${esc(w.journal || '')}${w.doi ? ` · <a href="https://doi.org/${encodeURI(w.doi)}" target="_blank" rel="noopener">${t.doi}</a>` : ''}</div>
    </div></article>`);

  const aff = a => `<article class="item" style="grid-template-columns:1fr"><div><div class="year">${a.from ? esc(a.from) + ' – ' + esc(a.to || t.present) : esc(a.y || '')}</div>
      <h3>${esc(a.role || a.dept || a.org)}</h3><div class="sub">${esc([a.dept && a.role ? a.dept : '', a.org].filter(Boolean).join(' · '))}</div></div></article>`;
  [['employments','jobs'],['educations','edus']].forEach(([id, k]) => { $('#' + id).className = ''; $('#' + id).innerHTML = list(data[k], t, aff); });

  $('#skills').innerHTML = `<h3>${t.h_skills}</h3>` + FB.skills.map(g => `<div class="sub" style="margin:16px 0 8px"><b>${esc(g.t)}</b></div><div class="chips">${g.i.map(x => `<span>${esc(x)}</span>`).join('')}</div>`).join('')
    + `<h3 style="margin-top:34px">${t.h_conf}</h3><div class="chips">${FB.conf.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
  $('#nWorks').textContent = data.works ? String(data.works.length).padStart(2, '0') : '–';

  const iv = CONFIG.interests[lang] || [], cv = CONFIG.courses[lang] || [];
  fill('interestList', iv); fill('courseList', cv);
  [['interests', iv], ['teaching', cv]].forEach(([id, arr]) => {
    $('#' + id).hidden = !arr.length; document.querySelector(`[data-sec=${id}]`).hidden = !arr.length;
  });
}

/* ---------- Optional features (all free) ---------- */
const mail = `mailto:${CONFIG.email}`;
$('#mailBtn').href = $('#mailBtn2').href = mail;
$('#mailBtn2').textContent = CONFIG.email; $('#pEmail').textContent = CONFIG.email;
$('#orcidLink').href = validOrcid ? `https://orcid.org/${CONFIG.orcid}` : 'https://orcid.org';
$('#copy').textContent = `© ${new Date().getFullYear()} Sadoun.M.E. Sultan`;

const names = { scholar:'Google Scholar', scopus:'Scopus', researchgate:'ResearchGate', linkedin:'LinkedIn', facebook:'Facebook', youtube:'YouTube' };
const soc = Object.entries(CONFIG.links).filter(([, u]) => safeUrl(u)).map(([k, u]) => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener me">${names[k]}</a>`);
if (validOrcid) soc.unshift(`<a href="https://orcid.org/${CONFIG.orcid}" target="_blank" rel="noopener me">ORCID</a>`);
$('#social').innerHTML = soc.join('');

if (/^\d{8,15}$/.test(CONFIG.whatsapp)) { $('#wa').href = `https://wa.me/${CONFIG.whatsapp}`; $('#wa').hidden = false; }

if (CONFIG.cvPdf) fetch(CONFIG.cvPdf, { method: 'HEAD' }).then(r => { if (r.ok) { $('#cvPdf').href = CONFIG.cvPdf; $('#cvPdf').download = ''; $('#cvPdf').hidden = false; } }).catch(() => {});

if (/^[a-z0-9-]+$/i.test(CONFIG.goatcounter)) {
  const s = document.createElement('script'); s.async = true; s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = `https://${CONFIG.goatcounter}.goatcounter.com/count`; document.head.appendChild(s);
}

if (/^[a-z0-9]+$/i.test(CONFIG.formspree)) {
  const f = $('#form'); f.hidden = false;
  f.addEventListener('submit', async e => {
    e.preventDefault(); const t = I18N[lang], btn = f.querySelector('button'); btn.disabled = true;
    try {
      const r = await fetch(`https://formspree.io/f/${CONFIG.formspree}`, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(f) });
      if (!r.ok) throw 0; f.reset(); $('#fmsg').textContent = t.f_ok;
    } catch { $('#fmsg').textContent = t.f_err; }
    btn.disabled = false;
  });
}

/* ---------- UI ---------- */
const root = document.documentElement;
root.dataset.theme = store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; store.set('theme', root.dataset.theme); };
const PALETTES = ['emerald', 'royal', 'teal', 'plum'];
root.dataset.palette = PALETTES.includes(store.get('palette')) ? store.get('palette') : 'emerald';
const syncMeta = () => { $('meta[name=theme-color]').content = getComputedStyle(root).getPropertyValue('--navy').trim(); };
$('#palette').onclick = () => { root.dataset.palette = PALETTES[(PALETTES.indexOf(root.dataset.palette) + 1) % PALETTES.length]; store.set('palette', root.dataset.palette); syncMeta(); };
syncMeta();
$('#lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('lang', lang); render(); };
$('#print').onclick = () => window.print();
$('#menu').onclick = () => { const o = $('#nav').classList.toggle('open'); $('#menu').setAttribute('aria-expanded', o); };
$('#nav').addEventListener('click', e => { if (e.target.tagName === 'A') $('#nav').classList.remove('open'); });
$('#top-btn').onclick = () => scrollTo({ top: 0 });
addEventListener('scroll', () => $('#top-btn').classList.toggle('show', scrollY > 600), { passive: true });

render();
load();
</script>
